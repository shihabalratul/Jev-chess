name: Release

# Push a tag like v1.3.0 to build the Chrome extension and publish a GitHub Release with the zip attached.
# Notes come from .github/release-notes/<tag>.md when that file exists.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:extension
      - name: Zip the extension
        run: |
          cd apps/extension/dist
          zip -r "$GITHUB_WORKSPACE/jevchess-chrome-${GITHUB_REF_NAME}.zip" .
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" "jevchess-chrome-${GITHUB_REF_NAME}.zip" \
            --title "JevChess ${GITHUB_REF_NAME}" --verify-tag "$@"
